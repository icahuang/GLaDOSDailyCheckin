name: GLaDOS Checkin

on:
  push:
    branches: [ main ]
  schedule:
    # 每天北京时间早上 1:00 自动执行 (UTC 17:00 前一天)
    - cron: '0 17 * * *'
  workflow_dispatch: # 允许手动点击运行

jobs:
  build:
    # 固定到 24.04 而不是 ubuntu-latest：latest 会在 2026-10-19 ~ 11-19 之间
    # 灰度迁移到 Ubuntu 26.04，不同仓库翻转时间不同，可能出现「什么都没改却挂了」。
    # 24.04 标签在迁移后仍然可用，需要时手动升到 26.04 即可。
    runs-on: ubuntu-24.04

    steps:
    # 这两个 action 都用 Node 24 运行时（v5/v6 起），
    # 旧的 checkout@v3 / setup-python@v4 仍是 Node 20，会报 deprecated 警告
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    # 当Action成功后，在Run checkin script一栏可以看到签到结果和剩余会员天数
    - name: Run checkin script
      env:
        GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
        # 可选：仅在遇到 code=4 device-mismatch（设备绑定）时才需要，
        # 设成与取 Cookie 时相同的浏览器 UA。未设置时脚本用内置默认值。
        GLADOS_USER_AGENT: ${{ secrets.GLADOS_USER_AGENT }}
      run: python checkin.py